integrations:
  app_store_connect: "godforce1907-ux's Org"

workflows:
  ios-build:
    name: JOURNI iOS Build
    max_build_duration: 60
    environment:
      ios_signing:
        provisioning_profiles:
          - profile: journi_app_store
      groups:
        - supabase
      vars:
        VITE_SUPABASE_URL: $VITE_SUPABASE_URL
        VITE_SUPABASE_ANON_KEY: $VITE_SUPABASE_ANON_KEY
      node: 22
      xcode: latest
      cocoapods: default
    scripts:
      - name: Install dependencies
        script: npm install
      - name: Build web app
        script: npm run build
      - name: Sync Capacitor
        script: npx cap sync ios
      - name: Apply signing profiles
        script: |
          cd ios/App
          xcode-project use-profiles
      - name: Archive iOS app
        script: |
          cd ios/App
          xcodebuild -project App.xcodeproj -scheme App -sdk iphoneos -configuration Release -archivePath "$CM_BUILD_DIR/ios/App/App.xcarchive" archive
      - name: Export signed IPA
        script: |
          cd ios/App
          cat > ExportOptions.plist <<'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>app-store</string>
            <key>signingStyle</key>
            <string>manual</string>
            <key>compileBitcode</key>
            <true/>
            <key>provisioningProfiles</key>
            <dict>
              <key>com.godforce1907.journi</key>
              <string>Journi App Store</string>
            </dict>
          </dict>
          </plist>
          EOF
          xcodebuild -exportArchive -archivePath "$CM_BUILD_DIR/ios/App/App.xcarchive" -exportPath "$CM_BUILD_DIR/ios/App/ipa" -exportOptionsPlist ExportOptions.plist
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
